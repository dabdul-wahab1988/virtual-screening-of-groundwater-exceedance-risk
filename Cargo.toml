[package]
name = "groundwater_virtual_screening"
version = "0.1.0"
edition = "2021"
description = "Leakage-controlled virtual screening of groundwater quality exceedance — Pru Basin, Ghana"
authors = ["Dr. Sukari Research Group"]

[[bin]]
name = "gvs"
path = "src/main.rs"

[dependencies]
clap        = { version = "4",    features = ["derive"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
serde       = { version = "1",    features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
csv         = "1"
sha2        = "0.10"
hex         = "0.4"
chrono      = { version = "0.4",  features = ["serde"] }
anyhow      = "1"
thiserror   = "1"
log         = "0.4"
env_logger  = "0.11"
rand        = "0.8"
rand_chacha = "0.3"

[profile.release]
opt-level = 3
lto       = true
