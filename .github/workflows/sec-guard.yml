name: Security Guard

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  sec-guard:
    name: Scan repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run sec-guard-action
        id: sec_guard
        uses: dabdul-wahab1988/sec-guard-action@v1
        with:
          severity_threshold: high
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage SARIF report
        if: always() && steps.sec_guard.outputs.scan_complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sec-guard
          cp "${{ steps.sec_guard.outputs.sarif_path }}" .sec-guard/report.sarif

      - name: Upload SARIF to code scanning
        if: >-
          always() &&
          steps.sec_guard.outputs.scan_complete == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .sec-guard/report.sarif
          category: sec-guard-action

      - name: Write scan summary
        if: always()
        env:
          SCAN_COMPLETE: ${{ steps.sec_guard.outputs.scan_complete || 'unknown' }}
          BLOCKING_FINDINGS: ${{ steps.sec_guard.outputs.blocking_findings || 'unknown' }}
          EXIT_CODE: ${{ steps.sec_guard.outputs.exit_code || 'unknown' }}
        shell: bash
        run: |
          {
            echo "## sec-guard-action"
            echo
            echo "| Metric | Result |"
            echo "| --- | ---: |"
            echo "| Scan complete | ${SCAN_COMPLETE} |"
            echo "| Blocking findings | ${BLOCKING_FINDINGS} |"
            echo "| Exit code | ${EXIT_CODE} |"
            echo
            echo "Detailed JSON, SARIF, and optional patch files are available in the \`sec-guard-results\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
